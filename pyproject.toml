[project]
name = "besporman-tg-bot"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Mahdi Khoramabadi", email = "122166894+meytiii@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.17.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
]

[project.scripts]
besporman-tg-bot = "besporman_tg_bot:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
